name: contracts-tests-obs

# PASS C (Fable 5 rollout, STEP9+STEP10 — FINAL): schema-driven contract tests
# (schemathesis, smoke tier) + pipeline observability manifest. PRODUCER-ONLY:
# contexts `contract-tests` and `obs-manifest` are NOT required until PASS-C-c.
# Both jobs follow the ALWAYS-REPORT pattern (canon GITNEXUS-REQUIRED-CHECK-
# PATHFILTER-FIX): no pull_request paths: filter; heavy work is internally
# conditional; irrelevant diffs end COMPLETED/SUCCESS with an explicit notice —
# safe to require later. NO-MOCK: schema/tool failure => UNKNOWN visible; empty
# manifest => UNKNOWN. Live Langfuse ingestion is OPTIONAL behind LANGFUSE_*
# secrets (skip-success unset). Canon: docs/canon/GITNEXUS-STEP9-10-
# CONTRACTTESTS-OBS.md.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: contracts-tests-obs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract-tests:
    name: contract-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: Orchestrator self-check (always — cheap)
        run: python3 scripts/gitnexus/contract_tests.py --check
      - name: Detect relevant changes (required check always reports; heavy run is conditional)
        id: rel
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"; echo "push/dispatch — full run"; exit 0
          fi
          RE='^(api/|services/|apps/\.openapi-snapshot\.json|requirements[^/]*\.txt|pyproject\.toml|scripts/gitnexus/(contract_tests|contract_check)\.py|\.github/workflows/contracts-tests-obs\.yml)'
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qE "$RE"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"; echo "API-relevant changes — full smoke tier"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No API-relevant changes — SUCCESS no-op (always-report pattern)"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.rel.outputs.relevant == 'true'
        with:
          python-version: '3.12'
          cache: pip
      - name: Install app deps + schemathesis (pinned 3.39.16)
        if: steps.rel.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          pip install -q -r requirements.txt
          pip install -q schemathesis==3.39.16
          schemathesis --version
      - name: Run contract tests (smoke tier, in-process ASGI — no server boot)
        if: steps.rel.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          python3 scripts/gitnexus/contract_tests.py --run \
            --workdir "$RUNNER_TEMP/ct" --json "$RUNNER_TEMP/ct/verdict.json"
      - name: Upload contract-tests evidence
        if: always() && steps.rel.outputs.relevant == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contract-tests-evidence
          path: ${{ runner.temp }}/ct
          retention-days: 14
          if-no-files-found: ignore
      - name: No-op notice (context still reports SUCCESS)
        if: steps.rel.outputs.relevant != 'true'
        run: echo "contract-tests SUCCESS (no API-relevant changes — smoke tier not applicable)"

  obs-manifest:
    name: obs-manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Builder self-check (always — cheap, pure)
        run: python3 scripts/gitnexus/obs_manifest.py --check
      - name: Build observability manifest (cheap — runs fully on every PR)
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/gitnexus/obs_manifest.py --run \
            --repo "${{ github.repository }}" --sha "$HEAD_SHA" \
            --out "$RUNNER_TEMP/obs/obs-manifest.json"
      - name: Upload obs-manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: obs-manifest
          path: ${{ runner.temp }}/obs
          retention-days: 14
          if-no-files-found: error
      - name: Langfuse ingestion (OPTIONAL — operator secrets; absent => skip SUCCESS)
        env:
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${LANGFUSE_HOST:-}" ] || [ -z "${LANGFUSE_PUBLIC_KEY:-}" ] || [ -z "${LANGFUSE_SECRET_KEY:-}" ]; then
            echo "Langfuse not configured (LANGFUSE_* unset) — skip (documented optional follow-up; manifest artifact still produced)."
            exit 0
          fi
          PAYLOAD="$RUNNER_TEMP/obs/langfuse-batch.json"
          python3 - "$RUNNER_TEMP/obs/obs-manifest.json" "$PAYLOAD" <<'PYEOF'
          import datetime as dt
          import json, sys, uuid
          m = json.load(open(sys.argv[1]))
          now = dt.datetime.now(dt.UTC).isoformat()
          json.dump({"batch": [{"id": str(uuid.uuid4()), "type": "trace-create",
                                "timestamp": now,
                                "body": {"name": "ci-pipeline", "metadata": m}}]},
                    open(sys.argv[2], "w"))
          PYEOF
          curl -sSf -u "$LANGFUSE_PUBLIC_KEY:$LANGFUSE_SECRET_KEY" \
            -X POST "$LANGFUSE_HOST/api/public/ingestion" \
            -H 'Content-Type: application/json' \
            --data-binary @"$PAYLOAD" >/dev/null
          echo "manifest ingested to Langfuse"

  contracts-tests-obs:
    name: contracts-tests-obs
    needs: [contract-tests, obs-manifest]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate
        run: |
          set -euo pipefail
          ct="${{ needs.contract-tests.result }}"; ob="${{ needs.obs-manifest.result }}"
          echo "contract-tests: $ct · obs-manifest: $ob"
          [ "$ct" = "success" ] && [ "$ob" = "success" ] || { echo "::error::PASS C producer(s) red"; exit 1; }
          echo "contracts-tests-obs OK"
