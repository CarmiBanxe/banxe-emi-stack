name: merge-queue-impact

# PASS B / STEP8 (Fable 5 rollout): merge-queue impact RE-CHECK. At queue time
# the PR-time impact verdict may be stale (main moved) — this job re-runs
# impact_gate.py against the FRESHEST fleet-graph built for the merge-group
# head (fleet-graph.yml already runs on merge_group). Enforcement here uses the
# gate's own --enforce mode: CRITICAL/cross-zone blast radius without label
# `cross-repo-ack` => FAIL; stale/missing graph => UNKNOWN => FAIL VISIBLY
# (NO-MOCK; degradation to structural review + human ack is the documented
# recovery, never a silent pass). PRODUCER-ONLY: context `mq-impact` is NOT in
# branch protection until PASS-B-c (observe green in real queue runs first).
# Canon: docs/canon/GITNEXUS-STEP7-8-MCP-MERGEQUEUE.md.

on:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: mq-impact-${{ github.ref }}
  cancel-in-progress: false   # queue entries must each get their verdict

jobs:
  mq-impact:
    name: mq-impact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: Self-test (dispatch mode runs only this)
        run: python3 scripts/gitnexus/impact_gate.py --self-test
      - name: Locate + await fleet-graph run for the merge-group head
        if: github.event_name == 'merge_group'
        id: fg
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          run_id=""
          for i in $(seq 1 40); do
            run_id=$(gh run list --workflow fleet-graph --commit "$HEAD_SHA" \
              --json databaseId,status --jq '.[0].databaseId // empty' || true)
            status=$(gh run list --workflow fleet-graph --commit "$HEAD_SHA" \
              --json status --jq '.[0].status // empty' || true)
            if [ -n "$run_id" ] && [ "$status" = "completed" ]; then break; fi
            echo "waiting for fleet-graph run (attempt $i, run=$run_id status=$status)"
            sleep 15
          done
          if [ -z "$run_id" ]; then
            echo "::error title=mq-impact UNKNOWN::no fleet-graph run for merge-group head $HEAD_SHA — graph cannot answer at queue time (NO-MOCK); degrade to structural review + human ack."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download freshest fleet-graph-db
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ steps.fg.outputs.run_id }}" --name fleet-graph-db --dir .
          test -s fleet.db || { echo "::error title=mq-impact UNKNOWN::fleet.db artifact empty/missing (NO-MOCK)"; exit 1; }
      - name: Detect cross-repo-ack label (PR number derived from queue ref)
        if: github.event_name == 'merge_group'
        id: ack
        env:
          GH_TOKEN: ${{ github.token }}
          MG_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail
          # merge-queue head_ref shape: gh-readonly-queue/main/pr-<N>-<sha>
          pr=$(printf '%s' "$MG_REF" | grep -oE 'pr-[0-9]+' | head -1 | cut -d- -f2 || true)
          has=false
          if [ -n "$pr" ]; then
            has=$(gh pr view "$pr" --json labels --jq '[.labels[].name] | contains(["cross-repo-ack"])' || echo false)
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "present=$has" >> "$GITHUB_OUTPUT"
      - name: Re-run impact gate at queue time (ENFORCED via gate's own --enforce)
        if: github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed.txt
          ACK_FLAG=""
          [ "${{ steps.ack.outputs.present }}" = "true" ] && ACK_FLAG="--ack"
          python3 scripts/gitnexus/impact_gate.py \
            --db fleet.db --changed-files changed.txt \
            --json mq-impact.json --enforce $ACK_FLAG
          {
            echo "## mq-impact ($(jq -r .verdict mq-impact.json)) — queue-time re-check"
            echo "- PR: #${{ steps.ack.outputs.pr }} ack: ${{ steps.ack.outputs.present }}"
            echo "- graph_commit: \`$(jq -r .graph_commit mq-impact.json)\` built_at: $(jq -r .built_at mq-impact.json)"
            echo "- impacted: $(jq -r .impacted_total mq-impact.json), cross-zone: $(jq -r .cross_zone mq-impact.json), max: $(jq -r .max_criticality mq-impact.json)"
          } >> "$GITHUB_STEP_SUMMARY"
