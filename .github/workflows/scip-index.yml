name: scip-index

# STEP3 (Fable 5 rollout): SCIP symbol-graph PRODUCER — ground truth for STEP4 fleet
# graph. One artifact per project per commit, tagged graph_commit + built_at.
# PRODUCER-ONLY: the `scip-index` context must succeed but is NOT in branch
# protection yet (STEP3c after observed green — STEP1/STEP2 pattern).
# NO-MOCK: an indexer failure publishes status=UNKNOWN with the reason, visibly;
# an empty/absent index is NEVER published as OK. All-UNKNOWN => systemic FAIL.
# Canon: docs/canon/GITNEXUS-STEP3-SCIP-INDEX.md. Targets: config/gitnexus/scip.targets.json
# (generated by scripts/gitnexus/scip_manifest.py — drift-checked here).

on:
  pull_request:
    paths:
      - '**.py'
      - '**.ts'
      - '**.tsx'
      - '**/pyproject.toml'
      - '**/tsconfig.json'
      - '**/package.json'
      - 'config/gitnexus/scip.targets.json'
      - 'config/gitnexus/ownership.map.json'
      - 'scripts/gitnexus/scip_manifest.py'
      - '.github/workflows/scip-index.yml'
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# superseded commits stop indexing (cost control); main pushes never cancel each other
concurrency:
  group: scip-index-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  manifest:
    name: scip-manifest
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mtx.outputs.matrix }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Target manifest drift check
        run: python3 scripts/gitnexus/scip_manifest.py --check
      - name: Emit index matrix
        id: mtx
        run: echo "matrix=$(python3 scripts/gitnexus/scip_manifest.py --matrix)" >> "$GITHUB_OUTPUT"

  index:
    name: index (${{ matrix.slug }})
    needs: manifest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.manifest.outputs.matrix) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache npm (indexer install)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: scip-npm-${{ runner.os }}-v1
      - name: Install pinned indexer
        run: |
          set -e
          if [ "${{ matrix.lang }}" = "python" ]; then
            npm install -g @sourcegraph/scip-python@0.6.6
          else
            npm install -g @sourcegraph/scip-typescript@0.4.0
          fi
      - uses: actions/setup-python@v5
        if: matrix.lang == 'python'
        with:
          python-version: '3.12'
      - name: Run indexer (degrade to UNKNOWN, never empty-OK)
        id: run
        env:
          # graph_commit = the commit the graph describes (PR head, not merge ref)
          GRAPH_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          TARGET_PATH: ${{ matrix.path }}
          TARGET_SLUG: ${{ matrix.slug }}
          TARGET_LANG: ${{ matrix.lang }}
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/scip-out"; mkdir -p "$OUT"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          STATUS=OK; REASON=""
          cd "$TARGET_PATH"
          if [ "$TARGET_LANG" = "python" ]; then
            INDEXER="@sourcegraph/scip-python@0.6.6"
            # NOTE (documented in canon): project deps are NOT installed — internal
            # symbols/refs resolve; external-package refs stay unresolved (acceptable
            # for STEP4 internal-edge graph; revisit at STEP4 if externals needed).
            scip-python index . \
              --project-name "emi-${TARGET_SLUG}" \
              --project-version "$GRAPH_COMMIT" \
              --output "$OUT/index.scip" || { STATUS=UNKNOWN; REASON="scip-python exit $?"; }
          else
            INDEXER="@sourcegraph/scip-typescript@0.4.0"
            # deps needed for module resolution; ignore-scripts = no arbitrary code
            npm ci --ignore-scripts --no-audit --no-fund \
              || { STATUS=UNKNOWN; REASON="npm ci failed"; }
            if [ "$STATUS" = "OK" ]; then
              scip-typescript index \
                --output "$OUT/index.scip" || { STATUS=UNKNOWN; REASON="scip-typescript exit $?"; }
            fi
          fi
          # NO-MOCK: a zero-byte/absent index is UNKNOWN, never OK
          if [ "$STATUS" = "OK" ] && [ ! -s "$OUT/index.scip" ]; then
            STATUS=UNKNOWN; REASON="indexer exited 0 but produced no index"
          fi
          SCIP_BYTES=$(stat -c%s "$OUT/index.scip" 2>/dev/null || echo 0)
          jq -n \
            --arg project "emi-${TARGET_SLUG}" --arg path "$TARGET_PATH" \
            --arg lang "$TARGET_LANG" --arg graph_commit "$GRAPH_COMMIT" \
            --arg built_at "$BUILT_AT" --arg indexer "$INDEXER" \
            --arg status "$STATUS" --arg reason "$REASON" \
            --argjson scip_bytes "$SCIP_BYTES" \
            '{project:$project, path:$path, lang:$lang, graph_commit:$graph_commit,
              built_at:$built_at, indexer:$indexer, status:$status, reason:$reason,
              scip_bytes:$scip_bytes}' > "$OUT/scip-meta.json"
          cat "$OUT/scip-meta.json"
          if [ "$STATUS" != "OK" ]; then
            echo "::warning title=SCIP ${TARGET_SLUG} UNKNOWN::${REASON} — graph consumers must treat this project as UNKNOWN, not empty (NO-MOCK)."
          fi
          echo "out_dir=$OUT" >> "$GITHUB_OUTPUT"
      - name: Upload SCIP artifact (index + meta, or meta-only on UNKNOWN)
        uses: actions/upload-artifact@v4
        with:
          name: scip-${{ matrix.slug }}
          path: ${{ steps.run.outputs.out_dir }}
          retention-days: 14
          if-no-files-found: error

  scip-index:
    name: scip-index
    needs: [manifest, index]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all SCIP artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: scip-*
          path: all
      - name: Aggregate freshness + status (fail only on systemic all-UNKNOWN or missing)
        run: |
          set -euo pipefail
          if [ "${{ needs.manifest.result }}" != "success" ]; then
            echo "::error::manifest drift check failed"; exit 1
          fi
          total=0; ok=0
          {
            echo "## SCIP index summary"
            echo "| project | lang | status | bytes | graph_commit | built_at |"
            echo "|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for meta in all/scip-*/scip-meta.json; do
            [ -f "$meta" ] || continue
            total=$((total+1))
            s=$(jq -r .status "$meta"); [ "$s" = "OK" ] && ok=$((ok+1))
            jq -r '"| \(.project) | \(.lang) | \(.status)\(if .reason != "" then " ("+.reason+")" else "" end) | \(.scip_bytes) | \(.graph_commit[0:12]) | \(.built_at) |"' \
              "$meta" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "projects: $total, OK: $ok"
          if [ "$total" -eq 0 ]; then
            echo "::error::no SCIP artifacts produced at all — systemic failure"; exit 1
          fi
          if [ "$ok" -eq 0 ]; then
            echo "::error::every project is UNKNOWN — systemic indexer failure (NO-MOCK: not publishable as a graph)"; exit 1
          fi
          echo "scip-index OK ($ok/$total projects indexed; UNKNOWNs are visible above)"
