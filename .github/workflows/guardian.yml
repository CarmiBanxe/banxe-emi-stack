name: Guardian

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

permissions:
  contents: read
  pull-requests: write

jobs:
  guardian:
    name: guardian-${{ matrix.family }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        family: [factory, project]
    steps:
      - name: Checkout PR head
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # Degrade-to-skip (NOT a bypass): secrets are not usable in `if:`, so we map
      # them to env here and emit a step output. When the self-hosted Guardian is
      # unconfigured the job SUCCEEDS with a skip notice and runs no curl; the moment
      # TS_AUTHKEY + TS_GUARDIAN_<family>_URL are set, the full audit auto-recovers.
      - name: Check guardian configuration
        id: cfg
        env:
          AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          URL_FACTORY: ${{ secrets.TS_GUARDIAN_FACTORY_URL }}
          URL_PROJECT: ${{ secrets.TS_GUARDIAN_PROJECT_URL }}
        run: |
          if [ "${{ matrix.family }}" = "factory" ]; then url="$URL_FACTORY"; else url="$URL_PROJECT"; fi
          if [ -n "$AUTHKEY" ] && [ -n "$url" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Guardian skipped — self-hosted endpoint not configured (operator-gated)
        if: steps.cfg.outputs.configured != 'true'
        run: |
          echo "⚠️ guardian skipped: self-hosted endpoint not configured (operator-gated)."
          echo "Set TS_AUTHKEY + TS_GUARDIAN_${{ matrix.family }}_URL and bring evo1 up to activate the real gate."
          echo "## ⚠️ Guardian (${{ matrix.family }}) skipped — self-hosted endpoint not configured (operator-gated)" >> "$GITHUB_STEP_SUMMARY"

      - name: Connect to Tailscale (MagicDNS for evo1)
        if: steps.cfg.outputs.configured == 'true'
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:github-runner
          version: latest

      - name: Resolve guardian URL for ${{ matrix.family }}
        id: url
        if: steps.cfg.outputs.configured == 'true'
        env:
          URL_FACTORY: ${{ secrets.TS_GUARDIAN_FACTORY_URL }}
          URL_PROJECT: ${{ secrets.TS_GUARDIAN_PROJECT_URL }}
        run: |
          if [ "${{ matrix.family }}" = "factory" ]; then
            url="$URL_FACTORY"
          else
            url="$URL_PROJECT"
          fi
          if [ -z "$url" ]; then
            echo "::error::secret TS_GUARDIAN_${{ matrix.family }}_URL is not set"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Audit via Guardian (${{ matrix.family }})
        id: audit
        if: steps.cfg.outputs.configured == 'true'
        env:
          GUARDIAN_URL: ${{ steps.url.outputs.url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          FAMILY: ${{ matrix.family }}
        run: |
          set -euo pipefail
          ins_id=$(printf '%s' "$PR_BODY" | grep -oE 'INS-[0-9]{4}-[0-9]{2}-[0-9]{2}-[A-Za-z0-9.+-]+' | head -1 || true)
          prompt=$(printf '%s\n\n%s' "$PR_TITLE" "$PR_BODY")
          # Diff: PR head vs base (last 200 lines kept under request size)
          diff_text=$(git diff --no-color "${{ github.event.pull_request.base.sha }}".."${{ github.event.pull_request.head.sha }}" | head -c 60000 || true)
          files_changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}".."${{ github.event.pull_request.head.sha }}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          payload=$(jq -n \
            --arg request_id "guardian-${FAMILY}-${RUN_ID}" \
            --arg subject_type "pull_request" \
            --arg subject_id "${REPO}#${PR_NUMBER}" \
            --arg scope "$FAMILY" \
            --arg prompt "$prompt" \
            --arg branch "$BRANCH" \
            --arg ins "$ins_id" \
            --arg diff "$diff_text" \
            --argjson files "$files_changed" \
            --arg actor "$ACTOR" \
            '{request_id:$request_id, subject_type:$subject_type, subject_id:$subject_id, scope:$scope, prompt:$prompt, context:{branch:$branch, instruction_id:$ins, diff:$diff, files_changed:$files}, actor:$actor}')
          response=$(curl -sS --max-time 30 -X POST "$GUARDIAN_URL" -H 'Content-Type: application/json' -d "$payload")
          echo "$response" > /tmp/guardian-response.json
          result=$(echo "$response" | jq -r '.verdict.result // "error"')
          summary=$(echo "$response" | jq -r '.verdict.summary // "no summary"')
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          {
            echo "## Guardian (${FAMILY}) — ${result}"
            echo ""
            echo "**Summary:** ${summary}"
            echo ""
            echo "**Reasons:**"
            jq -r '.verdict.reasons[]? // empty' /tmp/guardian-response.json | sed 's/^/- /'
            echo ""
            echo "<sub>request_id: $(jq -r '.request_id' /tmp/guardian-response.json)</sub>"
          } > /tmp/guardian-comment.md
          cat /tmp/guardian-comment.md

      - name: Comment on PR
        if: always() && steps.cfg.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f /tmp/guardian-comment.md ]; then
            gh pr comment ${{ github.event.pull_request.number }} \
              -R ${{ github.repository }} \
              --body-file /tmp/guardian-comment.md
          else
            echo "no comment file"
          fi

      - name: Enforce verdict
        if: steps.cfg.outputs.configured == 'true' && steps.audit.outputs.result == 'fail'
        run: |
          echo "::error::Guardian (${{ matrix.family }}) verdict: ${{ steps.audit.outputs.summary }}"
          exit 1

  # ── STEP1b ports from banxe-architecture guardian.yml (Fable 5 roadmap §3/§6) ──
  # Both jobs run on pull_request AND merge_group so the status context resolves to
  # success inside the merge queue instead of skipping → timeout (architecture pattern).

  guardian-ledger:
    name: guardian-ledger
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: Ledger-coupling gate (ADR-056/ADR-060 shard bridge — emi-stack scope)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -e
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"; echo "$CHANGED"
          # emi-stack ADAPTATION vs banxe-architecture (deliberate, documented in
          # STEP1b IL shard): this is a CODE repo, so ADR-056 coupling binds
          # GOVERNANCE paths only (positive list). Verbatim architecture semantics
          # ("everything non-infra needs a shard") would demand a ledger shard on
          # every feature PR — scope decision deferred to operator at STEP1c.
          GOV_RE='^(docs/canon/|docs/adr/|\.claude/|config/gitnexus/|ledger/|INSTRUCTION-LEDGER\.md$)'
          GOV=$(echo "$CHANGED" | grep -E "$GOV_RE" | grep -v '^ledger/entries/' || true)
          if [ -z "$GOV" ]; then
            echo "guardian-ledger OK (no governance-path changes — coupling not required, emi-stack scope)"
            exit 0
          fi
          echo "Governance paths changed:"; echo "$GOV"
          NEW_SHARD=$(git diff --name-status "$BASE_SHA" "$HEAD_SHA" -- 'ledger/entries/' | grep -E '^A' | grep -E 'IL-.*\.md$' || true)
          if [ -z "$NEW_SHARD" ]; then
            echo "FAIL: PR changes governance paths but adds no new ledger/entries shard (ADR-056 / ADR-060 — add an IL-*.md shard under ledger/entries/<session>/)"
            exit 1
          fi
          echo "New shard(s):"; echo "$NEW_SHARD"
          echo "guardian-ledger OK"

  ledger-append-only:
    name: ledger-append-only
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: Ledger append-only immutability (ADR-057 / I-24 — emi-stack scope)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -e
          if ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
            echo "Base $BASE_SHA unavailable (new branch/first push); skipping immutability check"
            echo "ledger-append-only OK"
            exit 0
          fi
          # emi-stack ADAPTATION: INSTRUCTION-LEDGER.md is TRACKED here (architecture
          # gitignores + rebuilds it), so the line-removal check bites for real; and
          # ledger/entries/ shards are additionally immutable (I-24) — corrections
          # must be NEW shards, never edits/deletions of prior ones.
          REMOVED=$(git diff "$BASE_SHA" "$HEAD_SHA" -- INSTRUCTION-LEDGER.md | grep -E '^-[^-]' || true)
          if [ -n "$REMOVED" ]; then
            echo "FAIL: existing INSTRUCTION-LEDGER.md lines removed/modified (I-24 / ADR-057). Corrections must be a NEW appended IL block:"
            echo "$REMOVED"
            exit 1
          fi
          TOUCHED=$(git diff --name-status "$BASE_SHA" "$HEAD_SHA" -- 'ledger/entries/' | grep -E '^(M|D|R)' || true)
          if [ -n "$TOUCHED" ]; then
            echo "FAIL: existing ledger/entries shard(s) modified/renamed/deleted (I-24 append-only). Corrections must be NEW shards:"
            echo "$TOUCHED"
            exit 1
          fi
          echo "ledger-append-only OK"
